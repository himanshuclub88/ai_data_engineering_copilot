<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b16" />
  <title>AI Data Engineering Copilot</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><span>✦</span></div>
        <div>
          <div class="brand-name">Data Copilot</div>
          <div class="brand-subtitle">Engineering Intelligence</div>
        </div>
      </div>

      <button class="nav-home active" data-action="home">
        <span class="nav-icon">⌂</span>
        <span>Overview</span>
      </button>

      <div class="sidebar-label">PIPELINES</div>
      <div id="job-list" class="job-list"></div>

      <div class="sidebar-spacer"></div>
      <div class="sidebar-footer">
        <div class="tiny-status"><span class="status-dot"></span> API Connected</div>
        <div class="tiny-text">FastAPI backend</div>
      </div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div class="mobile-menu-wrap">
          <button class="icon-button mobile-only" data-action="toggle-sidebar" aria-label="Open navigation">☰</button>
        </div>

        <div class="topbar-title">
          <div class="eyebrow">AI OPERATIONS CONSOLE</div>
          <div class="page-title" id="topbar-title">Overview</div>
        </div>

        <div class="topbar-actions">
          <div class="theme-picker" id="theme-picker">
            <button class="theme-button" data-action="toggle-theme-menu" title="Change theme" aria-label="Change theme" aria-expanded="false">
              <span class="theme-button-icon">◐</span>
              <span class="theme-button-label">Theme</span>
            </button>
            <div class="theme-menu" id="theme-menu" role="menu">
              <button class="theme-option" data-action="select-theme" data-theme="obsidian" role="menuitem">
                <span class="theme-swatch obsidian"></span>
                <span><strong>Obsidian</strong><small>Deep dark</small></span>
                <span class="theme-check" aria-hidden="true">✓</span>
              </button>
              <button class="theme-option" data-action="select-theme" data-theme="light" role="menuitem">
                <span class="theme-swatch light"></span>
                <span><strong>Light</strong><small>Bright white</small></span>
                <span class="theme-check" aria-hidden="true">✓</span>
              </button>
              <button class="theme-option" data-action="select-theme" data-theme="slate" role="menuitem">
                <span class="theme-swatch slate"></span>
                <span><strong>Slate</strong><small>Soft medium</small></span>
                <span class="theme-check" aria-hidden="true">✓</span>
              </button>
              <button class="theme-option" data-action="select-theme" data-theme="cloud" role="menuitem">
                <span class="theme-swatch cloud"></span>
                <span><strong>Cloud</strong><small>Cool light</small></span>
                <span class="theme-check" aria-hidden="true">✓</span>
              </button>
              <button class="theme-option" data-action="select-theme" data-theme="sand" role="menuitem">
                <span class="theme-swatch sand"></span>
                <span><strong>Sand</strong><small>Warm light</small></span>
                <span class="theme-check" aria-hidden="true">✓</span>
              </button>
              <button class="theme-option" data-action="select-theme" data-theme="midnight" role="menuitem">
                <span class="theme-swatch midnight"></span>
                <span><strong>Midnight</strong><small>Deep blue</small></span>
                <span class="theme-check" aria-hidden="true">✓</span>
              </button>
              <button class="theme-option" data-action="select-theme" data-theme="emerald" role="menuitem">
                <span class="theme-swatch emerald"></span>
                <span><strong>Emerald</strong><small>Green observability</small></span>
                <span class="theme-check" aria-hidden="true">✓</span>
              </button>
              <button class="theme-option" data-action="select-theme" data-theme="amethyst" role="menuitem">
                <span class="theme-swatch amethyst"></span>
                <span><strong>Amethyst</strong><small>Violet premium</small></span>
                <span class="theme-check" aria-hidden="true">✓</span>
              </button>
            </div>
          </div>

          <div class="connection-pill" id="connection-pill">
            <span class="status-dot"></span>
            <span id="connection-text">Checking API</span>
          </div>
          <button class="icon-button" data-action="refresh" title="Refresh">↻</button>
        </div>
      </header>

      <section class="content" id="app"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <!-- Markdown rendering for Copilot responses. -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
